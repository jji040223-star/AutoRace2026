# 라이다 라바콘 (autorace_perception/lidar_processor.py, M8). 시뮬: 라이다 높이 0.111 m, 라바콘 단면 지름 약 4.3 cm
lidar_processor:
  ros__parameters:
    scan_topic: "/scan"
    odom_topic: "/odom"
    cones_topic: "/perception/cones"          # geometry_msgs/PoseArray, odom 좌표
    marker_topic: "/perception/cone_markers"
    laser_x: 0.103
    fov_deg: 90.0                       # 앞 ±
    range_min: 0.12                     # X2L 최소 거리
    range_max: 1.5
    cluster_gap_m: 0.06
    min_points: 1                       # 1.5 m 앞이면 1~2 점
    max_size_m: 0.12                    # 이보다 큰 묶음은 버림 (정차 LIMO 0.22, 벽)
    cone_radius_m: 0.022
    merge_m: 0.08
    min_hits: 2
    pass_margin_m: 0.4                  # 진행 방향으로 이만큼 지나간 뒤에 지움 (시간으로 안 지움)
    max_keep_m: 3.0
    free_frames: 3                      # 기억 자리 너머까지 빈 스캔이 이만큼 연속이면 지움 — 트랙 옆 사람이 발을 옮긴 자리 (0 = 끔)
    free_clear_m: 0.10
    free_win_m: 0.04
    free_frames_inf: 6                  # 너머가 '반사 없음' 뿐이면 이만큼 (실제 라이다는 먼 콘 반사가 가끔 빠짐)
    free_max_yaw_rate: 0.3              # 이보다 빨리 돌면 지우기 판단 안 함 [rad/s]
    tall_min_h: 0.35                    # 뎁스 장애물이 이보다 높으면 그 앞면의 라이다 점은 라바콘 아님 (사람 다리; 라바콘 0.19 m). 0 = 끔
    tall_floor_h: 0.27                  #   가까운 다리는 화면 위가 잘려 낮게 재짐 → 기준을 화면 위 높이 − 0.03 까지 내리되 이 밑으로는 안 내림
    tall_cam_h: 0.175                   #   실차: lane_calib 로 잰 카메라 높이·숙임, 뎁스 세로 화각 (camera_info: 2·atan(H / 2fy))
    tall_cam_vfov_deg: 45.0
    tall_cam_pitch_deg: 0.0
    tall_max_w: 0.25                    #   이보다 넓은 장애물은 안 씀 (합쳐진 묶음·벽·LIMO)
    tall_match_m: 0.04                  #   라이다 점이 그 장애물 바닥 상자 (이만큼 넓힘) 안이면 그 장애물의 점
    tall_keep_s: 15.0                   #   차 옆·뒤 (카메라 시야 밖) 에서 발을 옮겨도 이전에 본 자리는 남게
