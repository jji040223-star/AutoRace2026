# M4 T자 주차·탈출 (autorace_mission/parking_controller.py). 시뮬 칸: 안쪽 500 × 600 mm, 통로 (주차선 → 2차로 바깥 경계) 0.52 m
parking_controller:
  ros__parameters:
    standalone: false                   # true = /parking/start 없이 바로 시작 (주차 구역 앞에서). parking.launch 가 true 로
    bay_side: "right"                   # 주차 칸 줄이 진행 방향 어느 쪽 (시뮬: 2차로 +x 로 가면 오른쪽)
    bay_w: 0.50                         # 칸 안쪽 폭 (진행 방향) [m]
    bay_d: 0.60                         # 칸 안쪽 깊이 [m]
    approach_speed: 0.20  # 11-06: 0.10→0.20 (칸 경계는 스캔 사이 보간·방향 보정으로 속도 영향 줄임)
    wait_detect_m: 0.9                  # 통합 모드: 차선 추종 중 앞옆 이 거리 안에 주차 LIMO 가 보이면 접근 시작
    wait_min_pts: 10                    #   점 이만큼 이상 + 앞뒤 wait_min_len_m 이상 + wait_confirm 번 연속 (표지판 받침대·의자 다리 거름)
    wait_min_len_m: 0.15
    wait_confirm: 3
    row_keep_k: 1.5                     # 주차 LIMO 줄과 옆 거리 유지 (방향 보정 [rad/m], ±row_keep_max_deg)
    row_keep_max_deg: 6.0
    side_probe_dx: 0.04                 # 차 중심 옆 라이다 띠 (진행 방향 ±)
    side_near_m: 0.75                   # 옆 이 안 = 가까움 (LIMO)
    side_far_m: 0.95                    # 이 밖 = 멂 (빈 칸)
    gap_min_m: 0.45                     # 빈 칸 = LIMO 옆면 사이 이 폭 이상 (차 폭 0.22 + 여유)
    gap_max_m: 1.30
    limo_half_l: 0.161                  # 이웃 LIMO 끝면 → 칸 깊이 가운데
    align_tol_m: 0.008
    align_speed: 0.10
    rot_margin_m: 0.03                  # 제자리 회전 반경 (0.194 m) 여유 — 쓸기 검사
    rot_tol_deg: 1.5                    # IMU 90° 회전 허용 오차 (기본값 — 들어갈 때·나올 때는 rot_tol_in/out_deg). 규정은 각도 기준 없음, 네 모서리만
    rot_max_w: 1.0
    rot_min_w: 0.45  # 11-06: 0.2→0.45 — 현수막 트랙은 느린 제자리 회전이 구김에 걸려 안 돎 (run4 막힘, 시뮬 재현·해결)
    rot_slow_deg: 25.0                  # 오차 비례 감속 (이 오차에서 rot_max_w)
    rot_lag_s: 0.2  # 11-06: 0.45→0.2 — 시뮬 실측 0.09~0.24 s. 실차는 로그 [M4] 회전 관성 … 실제 지연 으로 맞출 것
    measure_s: 0.5
    measure_tol_m: 0.05                 # 돈 뒤 다시 잰 옆 오차가 이보다 크면 돌아 나와 다시 정렬
    enter_speed: 0.12                   # 진입 (11-06: 0.09→0.12)
    enter_min_speed: 0.03
    enter_kp: 0.5
    enter_k_lat: 2.0                    # 양옆 거리 같게 (P)
    enter_k_head: 1.5
    enter_max_w: 0.25                   # 칸 안 각속도 한도
    cam_x: 0.084
    line_match_m: 0.10
    depth_tol_m: 0.02
    corner_min_m: 0.03                  # 모서리 → 선 여유가 이보다 작으면 앞뒤 보정
    max_fix: 2
    hold_s: 3.0                         # 주차 뒤 정지 (사용자 11-10: 3 초)
    exit_speed: 0.20
    stuck_s: 1.0                        # 움직이라는데 이만큼 못 움직이면 정렬부터 다시
    max_retry: 3
    laser_x: 0.103

    # ---- 빈 칸 랜덤 (3 칸 중 하나) — 대회 맵 PDF 값 (판 10 × 6 m, 오차 ±2 mm) ----
    # 주차 정지선 (주차 표지판 옆 흰 가로선) x 5610–5650 mm, 칸 안쪽 500 × 600, 칸 선 20, 칸 가운데 6355 / 6875 / 7395, 막다른 끝 8130
    random_slot: true                   # false = 기존 (LIMO → 빈 칸 → LIMO 만, 가운데 칸만 됨)
    slot_count: 3
    slot_pitch_m: 0.52                  # 칸 폭 0.50 + 칸 선 0.02
    slot_from_line_m: 0.745             # 주차 정지선 앞쪽 끝 → 1 번 칸 가운데 (2 번 1.265, 3 번 1.785)
    slot_line_min_m: 0.3                # 기준선 = 처음 본 LIMO 점보다 0.3~2.0 m 앞 흰 가로선 (횡단보도 뒤 가로선은 2.47 m 이상이라 빠짐)
    slot_line_max_m: 2.0
    slot_match_m: 0.15                  # LIMO 가운데 ↔ 칸 가운데 이 안이면 그 칸에 LIMO
    slot_snap_max_m: 0.10               # 본 LIMO 로 칸 격자를 옮기는 최대
    slot_free_half_m: 0.20              # 빈 칸 확인 구간 = 칸 가운데 ± 이것
    slot_free_min_n: 3
    slot_free_ratio: 0.8
    slot_end_guard_m: 0.40              # 마지막 칸 가운데 + 이것까지 못 정하면 가장 비어 보인 칸 (막다른 끝은 + 0.735)
    end_open_m: 0.90                    # 선을 못 봤을 때만: 마지막 LIMO 뒤가 이만큼 비면 다음 칸 (가운데 칸이 빈 틈 0.822 보다 길게)
    limo_half_w: 0.109                  # 끝 칸 옆 맞춤: 이웃 LIMO 옆면 → 칸 가운데 0.52 − 0.109 = 0.411 m
    side_one_tol_m: 0.15
    # ---- 통로 끝 주황 종료선으로 칸 위치 확인 (end_check) — 빈 칸을 정한 뒤 종료선이 보일 때까지 전진해 거리를 잼 ----
    # 대회 맵: 통로 막다른 끝 x 8130, 3 번 칸 가운데 7395 → 종료선 앞 1.775 / 1.255 / 0.735 m 가 칸 가운데
    end_check: true                     # false = 흰선 기준만 (예전)
    end_to_last_m: 0.735                # 종료선 앞쪽 끝 → 마지막 칸 가운데
    end_check_tol_m: 0.08               # 흰선 기준과 이보다 더 다르면 종료선 기준을 씀 (경고 로그)
    end_check_n: 3                      # 종료선을 이만큼 본 뒤 (중앙값) 멈춤
    end_check_gate_m: 0.40              # 흰선 격자로 예상한 종료선 ± 이것 밖의 주황 가로선은 무시
    end_stop_m: 0.45                    # 종료선을 못 봐도 차 중심이 (가장 가까운 경우의) 종료선 이만큼 앞에 오면 멈추고 흰선 기준으로 — 넘어가지 않게
    end_view_min_m: 0.50                # 칸을 정했을 때 종료선 (가장 가까운 경우) 이 차 중심에서 이보다 가까우면 카메라 아래 → 후진하며 찾음
    end_view_max_m: 0.90                #   후진 한도: 종료선 (가장 가까운 경우) 이 이만큼 멀어질 때까지
    end_check_speed: 0.10
    end_check_timeout_s: 15.0
    bay_depth_default_m: 0.570          # 통로 가운데 → 칸 깊이 가운데 (LIMO 면을 못 쟀을 때)
