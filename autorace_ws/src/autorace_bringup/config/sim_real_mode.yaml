# 2D 시뮬 "실차 모드" — LIMO 로 실차 주행을 못 할 때만 쓴다. 실차 run1~5 (11-05, 연습 트랙) 에서 본 것을 흉내.
# 숫자 튜닝용이 아니라 "이런 상황에서 망가지지 않나" 확인용. 기존 시뮬 (이 파일 없이) 도 같이 통과해야 한다.
#
# 시뮬과 주행 노드에 같은 파일을 준다 (노드 이름별 섹션이라 각자 자기 것만 읽음):
#   C=$(ros2 pkg prefix autorace_bringup)/share/autorace_bringup/config/sim_real_mode.yaml
#   ros2 launch autorace_bringup sim2d.launch.py sim_params:=$C[,<배치 등 다른 yaml>]
#   ros2 launch autorace_mission drive.launch.py perception:=sim2d params:=$C
#
# LIMO 녹화본이 생기면 맞출 것: 차 반응 (tau_v·tau_w), 표지판 놓침 비율, 뎁스 구멍 비율.
sim2d:
  ros__parameters:
    # 카메라: 실차 보정값 (real_limo.yaml lane_calib). 시뮬 영상 중심은 가운데라 뎁스도 같은 각도
    hfov_deg: 66.4
    cam_height: 0.190
    cam_pitch_deg: 8.46
    cam_yaw_deg: 0.26
    camera_hz: 13.0                    # 실차 차선·YOLO 처리 초당 7~18 장
    image_noise: 6.0
    depth_dropout: 0.1                 # 검은 LIMO 면 뎁스 구멍 (추정 — 녹화본으로 확인)
    # 오도메트리: 휠은 회전을 23 % 적게 잼, 센서 켠 뒤 차를 옮겨 0° 가 트랙과 43° 틀어짐 (run5)
    odom_w_scale: 0.77
    odom_yaw0_deg: 43.0
    # 표지판 인식: 띄엄띄엄 (run5 출발 서행 표지판 약 40 장 중 13 장), 확신도 0.5~0.9
    det_miss: 0.4
    det_miss_stick: 0.6
    det_conf: [0.5, 0.9]
    # 오인식: 가끔 몇 장 연속 (run4: 3차선에서 화면 가득 478px 과속방지턱)
    det_false_rate: 0.004              # 장마다 (13 장/초 → 약 20 s 에 한 번)
    det_false_frames: [1, 5]
    det_false_box_px: [30, 480]
    # 영상 끊김 (run2: 차선 입력이 끊겨 멈칫)
    cam_stall_rate: 0.01
    cam_stall_s: [0.2, 0.6]
    # 표지판 지주가 라이다에 보임 (run2: 받침대 점 → 주차 오작동)
    sign_posts: true
lane_follower:
  ros__parameters:
    camera_hfov_deg: 66.4
    camera_height: 0.190
    camera_pitch_deg: 8.46
    camera_yaw_deg: 0.26
depth_obstacle:
  ros__parameters:
    cam_height: 0.190
    cam_pitch_deg: 8.46
    cam_yaw_deg: 0.26
lidar_processor:
  ros__parameters:
    tall_cam_h: 0.190
    tall_cam_pitch_deg: 8.46
    tall_cam_vfov_deg: 52.3            # 시뮬 영상 중심은 가운데 → 2·atan(0.75·tan(33.2°))
mission_manager:
  ros__parameters:
    m7_cam_hfov_deg: 66.4
    m7_cam_yaw_deg: 0.26
cmd_vel_mux:
  ros__parameters:
    stale_s: 0.5                       # real_limo.yaml 과 같게
