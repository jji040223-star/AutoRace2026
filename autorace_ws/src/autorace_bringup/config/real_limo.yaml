# 실차 LIMO Pro (wego) 보정값 — 시뮬과 같이 쓰는 기본 설정 위에 덮어쓴다 (drive.launch params:=이 파일).
#   ros2 launch autorace_mission drive.launch.py use_sim_time:=false reset_sim:=false params:=$(ros2 pkg prefix autorace_bringup)/share/autorace_bringup/config/real_limo.yaml
# 센서는 wego teleop_launch.py (카메라 각도 degree 0 — 바꾸면 다시 보정).
# 11-05 연습 트랙: 직선 차로 가운데, lane_calib (--hfov 66.4) + depth_calib. 두 높이 0.190 / 0.192 m → 차로 폭 0.525 m (도면 0.52).
# 숙인 각도가 둘이 다른 것 (8.46 / 5.32°) 은 정상: 실제 영상 중심이 cy 211 px (가운데 240 아님) — lane_follower 는 가운데를 가정하는
# 모델이라 lane_calib 값 (같은 가정으로 잰 것), 뎁스 쪽은 camera_info 를 쓰므로 실제 각도 (depth_calib).
lane_follower:
  ros__parameters:
    camera_hfov_deg: 66.4               # camera_info fx 488.2 → 2·atan(320/488.2)
    camera_height: 0.190
    camera_pitch_deg: 8.46
    camera_yaw_deg: 0.26
    yellow_hsv_lo: [10, 57, 133]        # 연습 트랙 노란 선 H 14–21, S 82–124, V 191–255 (매트 0 %)
    yellow_hsv_hi: [25, 255, 255]
    # 아커만 실차 (11-10 ack6: 코너에서 늦게 꺾어 이탈 — 바퀴가 명령의 절반 (28° → 13°) 만 꺾임). 팀원 11-09 ack5 에서 확인한 값
    curve_steer_bias: 0.4               # 시뮬 0.25. 게인 없이 0.8 (ack8·9 코너 가운데) → cmd_vel_mux ack_steer_gain 2.0 으로 실제 꺾임이 2 배라 0.4
    curve_slow: 0.8                     # 시뮬 0.5 — 코너 감속 (최대 곡률 1.05 라 코너에서 느리게)
depth_obstacle:
  ros__parameters:
    cam_height: 0.192
    cam_pitch_deg: 5.32
    cam_yaw_deg: 0.26
lidar_processor:
  ros__parameters:
    tall_cam_h: 0.192
    tall_cam_pitch_deg: 5.32
    tall_cam_vfov_deg: 46.8             # 화면 위 끝 = 2·atan(cy 211.3 / fy 488.2) (영상 중심이 위로 치우쳐 있어 실제 세로 화각 52.4° 대신)
mission_manager:
  ros__parameters:
    m7_cam_hfov_deg: 66.5
    m7_cam_yaw_deg: 0.26
    # 아커만 (11-10) — 실차 측정 전엔 시뮬 기본값. 실차검증_아커만.md 의 측정 1·5 결과로 바꿈 (주차 쪽과 같은 값)
    ack_min_radius_m: 0.95              # 최대 조향 원 반경 — 실차 11-10 측정 (곡률 최대 1.05, 좌우 같음). 시뮬 0.47
    ack_plan_radius_m: 1.0              # 경로 계획 반경 (시뮬 0.52) — 측정 최대에 여유
    ack_min_speed: 0.05                 # 실제로 움직이는 가장 작은 속도 + 0.01
    m7_change_speed: 0.10               # M7 차로 바꾸는 동안 (시뮬 0.08) — ack10: 0.08 로 정지에서 출발 못 함 (1.1 s 동안 0.2~0.6 cm). M7 만 0.1 (사용자 11-10)
    m7_back_speed: 0.10                 # M7 후진 (시뮬 0.06)
    m7_ack_min_speed: 0.10              # M7 원호 전진 최저 (앞이 가까워 줄어도 0.1 아래로 안 내림)
    m7_ack_back_straighten: true        # 목표 근처 (옆 차이 < lane_done) 후진은 차로 방향으로 펴며 — ack12: 빈 공간 앞에서 40° 틀어진 채 곧게 후진만 반복. 조향 게인 2 라 이제 펴짐 (목표가 옆이면 m7_ack_back_toward 가 먼저)
    m7_ack_back_toward: true            # 후진할 때 가야 할 쪽 반대로 조향 → 앞머리가 그쪽으로 (3 점 회전, 사용자 11-10). 그쪽으로 35° 넘으면 곧게
    m7_stuck_check_s: 2.5               # '명령은 가는데 안 움직임' 판정 시간 (시뮬 1.0) — ack11: 후진 → 전진 바꿀 때 실차가 1 s 넘게 늦게 출발
                                        #   (상자 안 닿음, 사용자 확인) → 직진 0.95 m 비었는데 막힘으로 세어 포기
    m7_retry_max: 99                    # 같은 자리 재시도 한도 (시뮬 3) — 포기 (멈춤) 가 규정상 가장 나쁨
    m7_ack_hold_target: true            # 막힘·후진 뒤 다시 고를 때 목표 차로 유지 (들어가거나 3 번 실패까지) — ack11: 목표 2↔1 왔다 갔다로 후진 회전 상쇄
    m8_stuck_check_s: 2.5               # M8 도 같은 이유
    m7_back_m: 0.2                      # 후진 거리 0.2 m 로 통일 (사용자 11-10) — 시뮬은 0.15 에서 같은 자리 n 번째면 n 배
    m7_back_grow: false                 #   늘리지 않음 (ack8·9: 0.45 m 까지 늘어 이전 구간까지 물러남)
    m8_back_m: 0.2                      # M8 후진도 0.2 (시뮬 0.10)
    m8_ack_path_scale: 0.7              # M8: 통로 축에서 옆 흔들림 0.7 배 — 공식 배치 가운데선 최소 반경 0.68 < 실차 0.95 (다른 세션 계산: 여유 5~8 cm)
    m8_ack_assist_s: 20.0               # M8 출구 코너 보조 최대 시간 (시뮬 10) — 반경 0.95 로 90° ≈ 1.5 m, ack15: 10 s 에 트랙 축과 +60° 남고 끝나 바깥 이탈
    m8_ack_assist_wait_s: 0.0           # 출구에서 차선 쌍 기다리지 않고 바로 코너 보조 (시뮬 0.4)
    m8_ack_exit_turn_now: true          # 마지막 틈 지나면 출구선 맞추기 없이 바로 최대 오른쪽 코너 보조 — ack15: 출구 축 +85° 오계산으로 왼쪽 꺾어 바깥 이탈
    m7_ack_gap_target: true             # M7: 차로 가운데 대신 다음 줄 상자 사이 빈 구간 (경계 지그재그) 목표 — 반경 0.95 로 매 줄 차로 가운데 S 자는 불가 (다른 세션 11-10)
    m7_ack_gap_clear_m: 0.20            # 경계 목표의 상자 옆 여유 (기본 0.13 → 쓸기 검사 0.139 하한) — ack12: 빈 공간 가장자리 목표라 상자 모서리에 걸림 → 가운데 쪽으로
    m7_lidar_clear_reach_m: 2.0         # 뎁스 기억 상자를 라이다 빔이 뚫으면 지우는 거리 (시뮬 1.2) — ack16: 비어 있는 왼쪽 차로에 가짜 상자가 남아 막힘 (5 번 늦게 지움)
    m7_lidar_clear_scans: 3             #   연속 스캔 수 (시뮬 4, 약 0.3 s)
parking_controller:
  ros__parameters:
    ack_min_radius_m: 0.95              # mission_manager 와 같게 (주차는 오른쪽 반경이 중요 — 좌우 다르면 오른쪽)
    ack_park_margin_m: -0.09            # 꺾기 시작 = 칸 가운데 − (반경 + 이것) = 0.86 m 앞 — 반경 0.95 면 0.82~0.90 m 앞에서 최대 조향,
                                        #   60~72° 에서 네 모서리 칸 안 (여유 8.6 cm, 이웃 LIMO 0.2 m — 다른 세션 park_geom.py 11-10). 시뮬 +0.08
    ack_min_speed: 0.05
    inside_margin_m: 0.04               # 칸 안 판정 여유 — 줄자 vs 로그 차이 2 cm 넘으면 0.06~0.08
odom_imu:
  ros__parameters:
    ack_ref_back_m: 0.1                 # 차 가운데 → 뒷축 (LIMO 축간 0.2 의 반)
cmd_vel_mux:
  ros__parameters:
    stale_s: 0.5                        # 실차 차선 노드가 YOLO 와 같이 돌아 초당 7~18 장 → 0.3 s 끊김이 잦아 멈칫 (11-05). 0.5 s
    ack_steer_gain: 2.0                 # 실차 11-10 측정: 명령 곡률의 절반만 돎 → 나가는 w 2 배 (최대 곡률 1.05 는 못 넘음)
