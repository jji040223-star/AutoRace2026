# 아커만 실차 가정 시험: 코드 (mission·parking) 는 최소 반경 0.47 로 알지만 실제 차는 덜 꺾임 (서보 오차 — 조향 배율 0.85 → 최소 반경 ≈ 0.56)
# + 서보 지연 0.15 s. 시뮬만 바꿈
sim2d:
  ros__parameters:
    drive_mode: ackermann
    ack_steer_scale: 0.85
    steer_tau: 0.15
mission_manager:
  ros__parameters:
    drive_mode: ackermann
parking_controller:
  ros__parameters:
    drive_mode: ackermann
