# 출발선 (트랙 좌측 상단 체커기) 에서 한 바퀴 전체: 서행 (M5) → 지그재그 (M6) → 횡단보도 (M3) → 3차선 (M7) → 갈림길 (M2)
# → 라바콘 (M8) → 신호등 (M1) → 주차 (M4). 시작 자세는 sim2d 기본 (0.74, 5.58, 0°)
sim2d:
  ros__parameters:
    start_x: 0.74
    start_y: 5.58
    start_yaw_deg: 0.0
    light_mode: wait_car               # 차가 신호등 정지선 앞에 설 때까지 빨강, 선 뒤 4 s 지나면 초록
